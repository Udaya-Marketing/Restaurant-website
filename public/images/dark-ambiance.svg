    <stop offset="60%" stop-color="#122B1E" stop-opacity="0.2"/>
    <stop offset="100%" stop-color="#000000" stop-opacity="0"/>
  </radialGradient>
  <rect width="1920" height="1080" fill="url(#lampGlow1)"/>
  <rect width="1920" height="1080" fill="url(#lampGlow2)"/>
  
